<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080b18">
<title>Play Game</title>
<link rel="stylesheet" href="style.css?v=3">



<script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
</head>
<body>


<div id="login-page" class="card">
  <h2>Welcome Back</h2>
  <p style="margin-bottom:14px;">Enter your player ID to continue</p>
  <div id="user-id" class="fake-input" contenteditable="true" data-placeholder="Enter Your ID" spellcheck="false"></div>
  <button onclick="login()">Enter Game</button>
</div>
<div id="main-menu" class="card hidden">
  <h2 id="welcome-text">Welcome</h2>
  <button onclick="showPage('game-mode-page')">Play Game</button>
  <button onclick="quit()" style="color:white; background:linear-gradient(135deg,#ff7798,#db315b); box-shadow:0 6px 0 #8d1d3d;">Quit</button>
</div>
<div id="game-mode-page" class="card hidden">
  <h2>Select Game Mode</h2>
  <button onclick="showPage('computer-modes')">Play with Computer</button>
  <button onclick="showPage('online-modes')" style="background:linear-gradient(135deg,#b77cff,#8032ff); box-shadow:0 6px 0 #4f1d9e; color:white;">Play Online</button>
  <button class="btn-back" onclick="showPage('main-menu')" style="margin-top:12px;">Back to Menu</button>
</div>
<div id="computer-modes" class="card hidden">
  <h2>Play with Computer</h2>
  <button onclick="startLudoGame('computer','1v1')">1 Vs 1</button>
  <button onclick="startLudoGame('computer','2v2')">2 Vs 2</button>
  <button onclick="startLudoGame('computer','4p')">4 Players</button>
  <button class="btn-back" onclick="showPage('game-mode-page')" style="margin-top:12px;">Back</button>
</div>
<div id="online-modes" class="card hidden">
  <h2>Play Online</h2>
  <button onclick="startLudoGame('online','1v1')">1 Vs 1</button>
  <button onclick="startLudoGame('online','2v2')">2 Vs 2</button>
  <button onclick="startLudoGame('online','4p')">4 Players</button>
  <button class="btn-back" onclick="showPage('game-mode-page')" style="margin-top:12px;">Back</button>
</div>


</div>



<div id="root" style="display:none"></div>
<div id="game-wrap" style="display:none">
<div id="emoji-houses">

  <div class="emoji-house eh-blue" data-house="blue"><button class="eh-toggle" aria-label="Blue emojis">😊</button><div class="eh-list"><button data-emoji="😊">😊</button><button data-emoji="😂">😂</button><button data-emoji="🤣">🤣</button><button data-emoji="😅">😅</button><button data-emoji="😬">😬</button><button data-emoji="😕">😕</button><button data-emoji="🙄">🙄</button><button data-emoji="🤕">🤕</button><button data-emoji="🥳">🥳</button><button data-emoji="😭">😭</button><button data-emoji="🤗">🤗</button><button data-emoji="☹">☹</button><button data-emoji="😢">😢</button><button data-emoji="😡">😡</button><button data-emoji="😤">😤</button><button data-emoji="👻">👻</button><button data-emoji="🙏">🙏</button><button data-emoji="🤝">🤝</button><button data-emoji="🐍">🐍</button><button data-emoji="🐢">🐢</button><button data-emoji="🔪">🔪</button><button data-emoji="😋">😋</button><button data-emoji="🤪">🤪</button><button data-emoji="😐">😐</button><button data-emoji="🤔">🤔</button><button data-emoji="😒">😒</button><button data-emoji="🤨">🤨</button><button data-emoji="😱">😱</button></div></div>

</div>

<div id="game-topbar"><button id="back-to-lobby" style="display:none">Back</button><span id="game-mode-label">Play Game</span></div>
<div id="game-root"></div>
<div id="game-chat">
  </div>
  <div class="chat-row">
    <input id="chat-input" type="text" maxlength="30" placeholder="Type your message..." autocomplete="off">
    <span id="chat-count">0/30</span>
    <button type="button" id="chat-send">Send</button>
  </div>
</div>
</div>
<div id="team-select" style="display:none">
<div class="team-card">
<h3>Select Your Team</h3>
<p class="team-sub">Select a team. Tap again to unselect it.</p>
<button type="button" id="team-btn-a" class="team-btn">Team A <span>Red + Orange</span></button>
<button type="button" id="team-btn-b" class="team-btn">Team B <span>Blue + Green</span></button>
<button type="button" id="team-start-btn" class="team-start" disabled>Start</button>
<button type="button" class="team-cancel">Cancel</button>
</div>
</div>





<!-- Music / sounds removed: game is fully silent -->

















<div id="online-search-overlay" style="display:none">
  <div class="online-spinner"></div>
  <div style="font-size:19px;font-weight:800">We are finding your opponent please wait</div>
  <div id="online-search-count">Connecting...</div>
  <button id="online-search-cancel" type="button" onclick="__cancelOnlineSearch()">Cancel</button>
</div>

<script src="script.js?v=4"></script>
</body>
</html>
